name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'noci')"
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix build .#default -L

      # The dev shell's browser would be a Chromium build from source here, so CI uses the one
      # on the runner. Setting it explicitly also means a runner without a browser fails rather
      # than skipping every test and reporting a green run.
      - name: Locate a browser
        run: |
          path=$(command -v google-chrome || command -v chromium || command -v chrome || true)
          if [ -z "$path" ]; then
            echo "no browser on this runner; the tests would all skip" >&2
            exit 1
          fi
          echo "Using $path"
          echo "CODEDOWN_TEST_CHROME=$path" >> "$GITHUB_ENV"

      - name: Test
        run: nix develop .#ci -c go test ./... -v
